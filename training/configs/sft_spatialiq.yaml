# SFT config for SpatialIQ — NeMo RL v0.5.0 format
sft:
  max_num_epochs: 3
  max_num_steps: 1000000
  early_stop_patience: 3       # stop after 3 val checks without improvement
  early_stop_min_delta: 0.0001 # minimum improvement to reset patience counter
  val_period: 50
  val_batches: 4
  val_global_batch_size: 8
  val_micro_batch_size: 1
  val_at_start: true
  val_at_end: true
  seed: 42

policy:
  model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  tokenizer:
    name: ${policy.model_name}
  train_global_batch_size: 16
  train_micro_batch_size: 1
  max_total_sequence_length: 2048
  precision: "bfloat16"
  max_grad_norm: 1.0
  offload_optimizer_for_logprob: false

  sequence_packing:
    enabled: false

  dynamic_batching:
    enabled: false

  dtensor_cfg:
    _v2: true
    enabled: true
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

  megatron_cfg:
    enabled: false

  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 2.0e-5
      weight_decay: 0.01
      betas: [0.9, 0.98]
      eps: 1e-8
      foreach: false
      fused: false

checkpointing:
  enabled: true
  checkpoint_dir: "./results/sft_spatialiq"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 3
  save_period: 50
  checkpoint_must_save_by: null

data:
  dataset_name: "spatialiq"
  train_data_path: null  # OVERRIDE: absolute path to train.jsonl
  val_data_path: null    # OVERRIDE: absolute path to val.jsonl
  prompt_file: null
  system_prompt_file: null
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: true
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 1

logger:
  log_dir: "logs/sft_spatialiq"
  wandb_enabled: false
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: "spatialiq"
    entity: "tom-vita"
    name: "sft-spatialiq-${policy.model_name}"
    group: "spatialiq-training"
    tags: ["sft", "spatialiq", "qwen2.5-vl"]
  tensorboard: {}
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 4
  num_nodes: 1
